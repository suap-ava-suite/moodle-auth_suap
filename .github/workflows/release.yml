##
# GitHub Actions workflow: generate an installable Moodle plugin ZIP when a GitHub Release is
# published, and attach it to that release as a downloadable asset.
#
# Usage:
#   1. Update version.php ($plugin->release must match the tag you are about to publish).
#   2. Publish a GitHub Release whose tag matches $plugin->release, e.g.:
#        gh release create 4.5.073 --title 4.5.073 --generate-notes
#   3. This workflow builds auth_suap-<version>.zip (docs/ excluded) and attaches it to that
#      release automatically.
#
# The resulting ZIP can be uploaded directly to
# Site administration → Plugins → Install plugins in Moodle.
##
name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Build and release plugin ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract and validate plugin version
        id: version
        run: |
          VERSION_RAW=$(grep -oP '\$plugin->version\s*=\s*\K[0-9_]+' version.php)
          VERSION=$(echo "$VERSION_RAW" | tr -d '_')
          RELEASE=$(grep -oP "\\\$plugin->release\s*=\s*'\K[^']+" version.php)
          COMPONENT=$(grep -oP "\\\$plugin->component\s*=\s*'\K[^']+" version.php)

          VERSION_SUFFIX="${VERSION: -3}"
          RELEASE_SUFFIX="${RELEASE##*.}"
          TAG="${GITHUB_REF_NAME#v}"

          SHORTNAME="${COMPONENT#*_}"

          echo "Plugin version raw: $VERSION_RAW"
          echo "Plugin version: $VERSION (suffix: $VERSION_SUFFIX)"
          echo "Plugin release: $RELEASE (suffix: $RELEASE_SUFFIX)"
          echo "Plugin component: $COMPONENT"
          echo "Plugin shortname: $SHORTNAME"
          echo "Tag (sem prefixo v): $TAG"

          # Validação 1: Últimos 3 dígitos devem corresponder
          if [ "$VERSION_SUFFIX" != "$RELEASE_SUFFIX" ]; then
            echo "::error::Os 3 últimos dígitos de \$plugin->version ($VERSION_SUFFIX) não correspondem aos 3 últimos dígitos de \$plugin->release ($RELEASE_SUFFIX) em version.php"
            exit 1
          fi

          # Validação 2: Release deve corresponder à tag
          if [ "$RELEASE" != "$TAG" ]; then
            echo "::error::\$plugin->release ($RELEASE) não corresponde ao nome da tag ($TAG). Atualize version.php antes de publicar a release."
            exit 1
          fi

          # Validação 3: Garantir que o componente foi encontrado
          if [ -z "$COMPONENT" ]; then
            echo "::error::A variável \$plugin->component não foi encontrada no version.php."
            exit 1
          fi

          # Exporta as variáveis para o próximo passo
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "shortname=$SHORTNAME" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        id: build
        run: |
          # Recupera as variáveis geradas no passo anterior
          COMPONENT="${{ steps.version.outputs.component }}"
          SHORTNAME="${{ steps.version.outputs.shortname }}"
          VERSION="${{ steps.version.outputs.number }}"
          
          # 1. Cria a pasta com o nome exato que o instalador do Moodle espera
          mkdir -p /tmp/build/$SHORTNAME

          # 2. Copia os arquivos do repositório, ignorando lixo de desenvolvimento e a
          #    documentação (docs/ é publicada separadamente via GitHub Pages — ver
          #    .github/workflows/docs.yml — e não faz parte do plugin instalável).
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.githooks' \
            --exclude='.idea' \
            --exclude='.pre-commit-config.yaml' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='SECURITY.md' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='vendor' \
            --exclude='docs' \
            . /tmp/build/$SHORTNAME/

          cd /tmp/build

          # 3. Dá ao arquivo ZIP o nome padrão (ex: auth_suap-2026082400.zip)
          ZIPFILE="${COMPONENT}-${VERSION}.zip"
          zip -r "$GITHUB_WORKSPACE/$ZIPFILE" $SHORTNAME/

          echo "zipfile=$ZIPFILE" >> "$GITHUB_OUTPUT"

      - name: Attach ZIP to the published release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.zipfile }}